<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Crypto Profit/Loss Calculator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
            min-height: 100vh;
        }

        .glass {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-glass {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .input-glass:focus {
            border-color: #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
            outline: none;
        }

        .tab-active {
            background: #6366f1;
            color: white;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        }

        .toggle-checkbox:checked {
            @apply: right-0 border-indigo-500;
            right: 0;
            border-color: #6366f1;
        }
        .toggle-checkbox:checked + .toggle-label {
            @apply: bg-indigo-500;
            background-color: #6366f1;
        }

        /* Hide number input arrows */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="text-slate-200 p-4 md:p-8 flex items-center justify-center">

    <div class="w-full max-w-3xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold tracking-tight text-white mb-2">
                Crypto <span class="text-indigo-400">Profit</span> Pro
            </h1>
            <p class="text-slate-400 text-sm">Real-time Analytics & Market Value Integration</p>
        </div>

        <!-- Main Calculator Card -->
        <div class="glass rounded-3xl p-6 md:p-8 shadow-2xl">
            
            <!-- Step 1: Crypto & Currency Selection -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="coins" class="w-3 h-3 text-indigo-400"></i> Select Cryptocurrency
                    </label>
                    <select id="cryptoAsset" onchange="fetchLivePrice()" class="w-full input-glass rounded-xl px-4 py-3 text-sm appearance-none cursor-pointer">
                        <option value="bitcoin">Bitcoin (BTC)</option>
                        <option value="ethereum">Ethereum (ETH)</option>
                        <option value="solana">Solana (SOL)</option>
                        <option value="binancecoin">Binance Coin (BNB)</option>
                        <option value="ripple">XRP (XRP)</option>
                        <option value="cardano">Cardano (ADA)</option>
                        <option value="dogecoin">Dogecoin (DOGE)</option>
                        <option value="polkadot">Polkadot (DOT)</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="banknote" class="w-3 h-3 text-indigo-400"></i> Calculation Currency
                    </label>
                    <select id="currency" onchange="updateCurrencyUI()" class="w-full input-glass rounded-xl px-4 py-3 text-sm appearance-none cursor-pointer">
                        <option value="USD">USD ($)</option>
                        <option value="INR">INR (₹)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="GBP">GBP (£)</option>
                        <option value="JPY">JPY (¥)</option>
                    </select>
                </div>
            </div>

            <!-- Step 2: Mode Selection -->
            <div class="flex p-1 bg-slate-900/50 rounded-xl mb-8">
                <button id="tab-trad" onclick="setMode('traditional')" class="tab-active flex-1 px-6 py-3 rounded-lg text-sm font-semibold transition-all duration-200">
                    Traditional (Qty)
                </button>
                <button id="tab-inv" onclick="setMode('investment')" class="flex-1 px-6 py-3 rounded-lg text-sm font-semibold text-slate-400 hover:text-white transition-all duration-200">
                    Investment ($)
                </button>
            </div>

            <!-- Step 3: Input Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <!-- Buy Price -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="arrow-down-right" class="w-3 h-3 text-indigo-400"></i> Buy Price
                    </label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 currency-symbol">$</span>
                        <input type="number" id="buyPrice" placeholder="0.00" step="any" class="w-full input-glass rounded-xl pl-10 pr-4 py-3 text-lg font-medium">
                    </div>
                </div>

                <!-- Quantity / Investment -->
                <div class="space-y-2">
                    <label id="mainInputLabel" class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="layers" class="w-3 h-3 text-indigo-400"></i> Quantity Held
                    </label>
                    <div class="relative">
                        <span id="mainInputPrefix" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 hidden">$</span>
                        <input type="number" id="mainInput" placeholder="0.00" step="any" class="w-full input-glass rounded-xl px-4 py-3 text-lg font-medium">
                    </div>
                </div>

                <!-- Sell Price Section -->
                <div class="md:col-span-2 space-y-4">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="arrow-up-right" class="w-3 h-3 text-indigo-400"></i> Selling Price
                        </label>
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-medium text-slate-500">Use Live Market Price</span>
                            <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                <input type="checkbox" id="livePriceToggle" onchange="toggleLivePrice()" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                                <label for="livePriceToggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-700 cursor-pointer"></label>
                            </div>
                        </div>
                    </div>
                    
                    <div id="manualSellPriceContainer" class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 currency-symbol">$</span>
                        <input type="number" id="sellPrice" placeholder="0.00" step="any" class="w-full input-glass rounded-xl pl-10 pr-4 py-3 text-lg font-medium">
                    </div>
                    
                    <div id="livePriceStatus" class="hidden p-4 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="relative flex h-3 w-3">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-500"></span>
                            </div>
                            <span class="text-sm font-medium text-indigo-300">Live Price:</span>
                        </div>
                        <span id="livePriceDisplay" class="text-xl font-bold text-white">Fetching...</span>
                    </div>
                </div>

                <!-- Fees Section -->
                <div class="md:col-span-2 pt-4">
                    <button onclick="toggleFees()" class="flex items-center gap-2 text-xs font-bold text-indigo-400 uppercase tracking-widest hover:text-indigo-300 transition-colors">
                        <i id="feeChevron" data-lucide="chevron-right" class="w-4 h-4 transition-transform"></i>
                        Trading Fees (Optional)
                    </button>
                    
                    <div id="feeSection" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6 mt-4 p-6 rounded-2xl bg-slate-900/30 border border-white/5">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-500 uppercase flex items-center gap-2">Buy Fee (%)</label>
                            <input type="number" id="buyFee" placeholder="0.00" step="any" class="w-full input-glass rounded-xl px-4 py-2 text-sm">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-500 uppercase flex items-center gap-2">Sell Fee (%)</label>
                            <input type="number" id="sellFee" placeholder="0.00" step="any" class="w-full input-glass rounded-xl px-4 py-2 text-sm">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-8 flex gap-4">
                <button onclick="calculate()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 px-6 rounded-2xl transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2">
                    <i data-lucide="calculator" class="w-5 h-5"></i> Calculate Results
                </button>
                <button onclick="reset()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-6 rounded-2xl transition-all duration-200 flex items-center justify-center">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Result Card -->
        <div id="resultCard" class="mt-8 glass rounded-3xl p-6 md:p-8 border-l-8 border-slate-600 transition-all duration-500 opacity-0 transform translate-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-center md:text-left">
                <div class="space-y-1">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Total P/L</p>
                    <h2 id="resultPL" class="text-3xl font-black">$0.00</h2>
                    <p id="resultPercentage" class="text-sm font-medium text-slate-400">+0.00%</p>
                </div>
                <div class="space-y-1">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Exit Value</p>
                    <h2 id="resultExit" class="text-3xl font-black text-white">$0.00</h2>
                    <p class="text-sm font-medium text-slate-400">After all fees</p>
                </div>
                <div class="space-y-1">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Asset Details</p>
                    <h2 id="resultQty" class="text-2xl font-black text-white">0.00</h2>
                    <p id="assetNameLabel" class="text-sm font-medium text-slate-400">BTC Held</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        let currentMode = 'traditional';
        let currencySymbol = '$';
        let livePriceValue = 0;
        let feesVisible = false;

        const currencyMap = {
            'USD': { symbol: '$', id: 'usd' },
            'INR': { symbol: '₹', id: 'inr' },
            'EUR': { symbol: '€', id: 'eur' },
            'GBP': { symbol: '£', id: 'gbp' },
            'JPY': { symbol: '¥', id: 'jpy' }
        };

        async function fetchLivePrice() {
            const coin = document.getElementById('cryptoAsset').value;
            const currency = document.getElementById('currency').value.toLowerCase();
            const display = document.getElementById('livePriceDisplay');
            
            try {
                display.innerText = "Fetching...";
                const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coin}&vs_currencies=${currency}`);
                const data = await response.json();
                livePriceValue = data[coin][currency];
                display.innerText = `${currencySymbol}${livePriceValue.toLocaleString()}`;
                
                // If live price is active, we might want to update the result if already calculated
                if (document.getElementById('livePriceToggle').checked) {
                    // Optionally auto-calculate
                }
            } catch (error) {
                console.error("Price fetch failed:", error);
                display.innerText = "Error fetching";
            }
        }

        function toggleLivePrice() {
            const isChecked = document.getElementById('livePriceToggle').checked;
            const manualContainer = document.getElementById('manualSellPriceContainer');
            const liveStatus = document.getElementById('livePriceStatus');
            
            if (isChecked) {
                manualContainer.classList.add('hidden');
                liveStatus.classList.remove('hidden');
                fetchLivePrice();
            } else {
                manualContainer.classList.remove('hidden');
                liveStatus.classList.add('hidden');
            }
        }

        function updateCurrencyUI() {
            const val = document.getElementById('currency').value;
            currencySymbol = currencyMap[val].symbol;
            
            document.querySelectorAll('.currency-symbol').forEach(el => el.innerText = currencySymbol);
            const prefix = document.getElementById('mainInputPrefix');
            if (currentMode === 'investment') prefix.innerText = currencySymbol;
            
            fetchLivePrice();
            hideResults();
        }

        function setMode(mode) {
            currentMode = mode;
            const tradTab = document.getElementById('tab-trad');
            const invTab = document.getElementById('tab-inv');
            const label = document.getElementById('mainInputLabel');
            const prefix = document.getElementById('mainInputPrefix');
            const input = document.getElementById('mainInput');

            if (mode === 'traditional') {
                tradTab.classList.add('tab-active');
                invTab.classList.remove('tab-active');
                invTab.classList.add('text-slate-400');
                label.innerHTML = `<i data-lucide="layers" class="w-3 h-3 text-indigo-400"></i> Quantity Held`;
                prefix.classList.add('hidden');
                input.classList.remove('pl-10');
            } else {
                invTab.classList.add('tab-active');
                tradTab.classList.remove('tab-active');
                tradTab.classList.add('text-slate-400');
                label.innerHTML = `<i data-lucide="wallet" class="w-3 h-3 text-indigo-400"></i> Total Investment`;
                prefix.classList.remove('hidden');
                prefix.innerText = currencySymbol;
                input.classList.add('pl-10');
            }
            lucide.createIcons();
            hideResults();
        }

        function toggleFees() {
            feesVisible = !feesVisible;
            const section = document.getElementById('feeSection');
            const chevron = document.getElementById('feeChevron');
            section.classList.toggle('hidden');
            chevron.style.transform = feesVisible ? 'rotate(90deg)' : 'rotate(0deg)';
        }

        function calculate() {
            const buyPrice = parseFloat(document.getElementById('buyPrice').value) || 0;
            const mainInputVal = parseFloat(document.getElementById('mainInput').value) || 0;
            const buyFeePct = parseFloat(document.getElementById('buyFee').value) || 0;
            const sellFeePct = parseFloat(document.getElementById('sellFee').value) || 0;
            
            let sellPrice = 0;
            if (document.getElementById('livePriceToggle').checked) {
                sellPrice = livePriceValue;
            } else {
                sellPrice = parseFloat(document.getElementById('sellPrice').value) || 0;
            }

            if (buyPrice <= 0 || sellPrice <= 0 || mainInputVal <= 0) {
                alert("Please ensure Buy Price, Sell Price, and Quantity/Investment are valid.");
                return;
            }

            let quantity = 0;
            let totalInvestment = 0;

            if (currentMode === 'traditional') {
                quantity = mainInputVal;
                totalInvestment = quantity * buyPrice;
            } else {
                totalInvestment = mainInputVal;
                quantity = totalInvestment / buyPrice;
            }

            const buyFeeAmount = totalInvestment * (buyFeePct / 100);
            const netInvestment = totalInvestment + buyFeeAmount;

            const grossExitValue = quantity * sellPrice;
            const sellFeeAmount = grossExitValue * (sellFeePct / 100);
            const netExitValue = grossExitValue - sellFeeAmount;

            const profitLoss = netExitValue - netInvestment;
            const percentageChange = (profitLoss / netInvestment) * 100;

            displayResults(profitLoss, percentageChange, netExitValue, quantity);
        }

        function displayResults(pl, pct, exit, qty) {
            const card = document.getElementById('resultCard');
            const coinText = document.getElementById('cryptoAsset').options[document.getElementById('cryptoAsset').selectedIndex].text.split('(')[1].replace(')', '');
            
            document.getElementById('resultPL').innerText = `${pl < 0 ? '-' : ''}${currencySymbol}${Math.abs(pl).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('resultPercentage').innerText = `${pl >= 0 ? '+' : ''}${pct.toFixed(2)}%`;
            document.getElementById('resultExit').innerText = `${currencySymbol}${exit.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('resultQty').innerText = qty.toLocaleString(undefined, {maximumFractionDigits: 8});
            document.getElementById('assetNameLabel').innerText = `${coinText} Assets`;

            // Style Updates
            card.classList.remove('opacity-0', 'translate-y-4', 'border-emerald-500', 'border-rose-500', 'border-slate-600');
            const plValueText = document.getElementById('resultPL');
            plValueText.classList.remove('text-emerald-400', 'text-rose-400', 'text-slate-400');

            if (pl > 0.01) {
                card.classList.add('border-emerald-500');
                plValueText.classList.add('text-emerald-400');
            } else if (pl < -0.01) {
                card.classList.add('border-rose-500');
                plValueText.classList.add('text-rose-400');
            } else {
                card.classList.add('border-slate-600');
                plValueText.classList.add('text-slate-400');
            }

            card.classList.add('opacity-100', 'translate-y-0');
        }

        function hideResults() {
            document.getElementById('resultCard').classList.add('opacity-0', 'translate-y-4');
        }

        function reset() {
            document.querySelectorAll('input').forEach(input => input.value = '');
            document.getElementById('livePriceToggle').checked = false;
            toggleLivePrice();
            hideResults();
        }

        // Initial Load
        fetchLivePrice();
    </script>
</body>
</html>
